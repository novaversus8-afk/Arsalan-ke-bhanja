<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>City Rush — Open City</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;font-family:Arial;color:#fff}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;z-index:5;display:flex;justify-content:space-between;pointer-events:none}
.box{background:#071019d9;border:1px solid #ffffff22;border-radius:14px;padding:9px 12px;box-shadow:0 8px 20px #0007}
.money{color:#72ff9b;font-weight:900}
#mission{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;min-width:230px}
#mission b{color:#ffd84a}
#touch{position:fixed;inset:auto 0 20px 0;z-index:10;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:5px;pointer-events:auto}
.pad button,.act button{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff25;background:#071019bb;color:#fff;font-size:21px}
.act{display:flex;gap:9px;align-items:end;pointer-events:auto}
.act button{width:58px;height:58px}
#start,#win{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#06111dcc,#071e37e8)}
.card{width:min(90%,390px);padding:28px;border-radius:28px;background:#101c29eF;border:1px solid #ffffff20;text-align:center;box-shadow:0 20px 60px #0009}
.card h1{font-size:34px;margin:0 0 8px}
.card p{color:#b7c1ca;line-height:1.5}
.startbtn{margin-top:18px;width:100%;padding:16px;border:0;border-radius:17px;background:#ffd83d;color:#111;font-size:17px;font-weight:900}
.hidden{display:none!important}
.small{font-size:11px;color:#9da8b2}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="box">
    ❤️ <span id="hp">100</span>
    &nbsp; ⭐ <span id="score">0</span>
  </div>
  <div class="box money">$<span id="money">0</span></div>
</div>

<div id="mission" class="box">
  <b>MISSION 1</b><br>
  📍 Drive to the yellow marker
</div>

<div id="touch">
  <div class="pad">
    <span></span>
    <button data-k="up">▲</button>
    <span></span>
    <button data-k="left">◀</button>
    <button data-k="down">▼</button>
    <button data-k="right">▶</button>
    <span></span><span></span><span></span>
  </div>
  <div class="act">
    <button data-k="boost">⚡</button>
    <button data-k="brake">🛑</button>
  </div>
</div>

<div id="start">
  <div class="card">
    <h1>🏙️ City Rush</h1>
    <p>Open-city driving adventure.<br>Drive, explore and complete missions.</p>
    <button class="startbtn" onclick="startGame()">START GAME</button>
    <p class="small">Original browser game • No API key</p>
  </div>
</div>

<div id="win" class="hidden">
  <div class="card">
    <h1>🏆 Mission Complete!</h1>
    <p>You reached the destination.</p>
    <button class="startbtn" onclick="nextMission()">NEXT MISSION</button>
  </div>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

let W,H;
function resize(){
  W=c.width=innerWidth;
  H=c.height=innerHeight;
}
addEventListener("resize",resize);
resize();

const keys={up:false,down:false,left:false,right:false,boost:false,brake:false};

addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
  if(e.key==="ArrowDown"||e.key==="s")keys.down=true;
  if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
  if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
  if(e.key==="Shift")keys.boost=true;
  if(e.key===" ")keys.brake=true;
});

addEventListener("keyup",e=>{
  if(e.key==="ArrowUp"||e.key==="w")keys.up=false;
  if(e.key==="ArrowDown"||e.key==="s")keys.down=false;
  if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
  if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
  if(e.key==="Shift")keys.boost=false;
  if(e.key===" ")keys.brake=false;
});

document.querySelectorAll("[data-k]").forEach(b=>{
  const k=b.dataset.k;
  b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
  b.onpointerup=e=>{e.preventDefault();keys[k]=false};
  b.onpointercancel=()=>keys[k]=false;
  b.onpointerleave=()=>keys[k]=false;
});

let gameStarted=false;
let mission=1;
let score=0;
let money=0;

const player={
  x:700,y:700,
  angle:0,
  speed:0,
  hp:100,
  car:true
};

let camera={x:0,y:0};

const world={w:3000,h:3000};

const roads=[];
for(let x=250;x<world.w;x+=500)roads.push({x,y:0,w:90,h:world.h});
for(let y=250;y<world.h;y+=500)roads.push({x:0,y,w:world.w,h:90});

const buildings=[];
for(let x=50;x<world.w;x+=180){
  for(let y=50;y<world.h;y+=180){
    if((x/180+y/180)%2===0){
      buildings.push({
        x:x+20,
        y:y+20,
        w:110,
        h:105,
        color:["#273b4a","#334454","#263743","#3a3d4c"][
          Math.floor(Math.random()*4)
        ]
      });
    }
  }
}

const trees=[];
for(let i=0;i<90;i++){
  trees.push({
    x:Math.random()*world.w,
    y:Math.random()*world.h
  });
}

const cars=[];
for(let i=0;i<18;i++){
  cars.push({
    x:Math.random()*world.w,
    y:Math.random()*world.h,
    a:Math.random()*Math.PI*2,
    v:1+Math.random()*1.3,
    color:["#e64b4b","#43a5e8","#f1c84b","#e95fd1","#57d18a"][
      Math.floor(Math.random()*5)
    ]
  });
}

let target={x:1250,y:750};

function newTarget(){
  const pts=[
    [250,250],[750,250],[1250,250],[1750,250],[2250,250],
    [250,750],[750,750],[1250,750],[1750,750],[2250,750],
    [250,1250],[750,1250],[1250,1250],[1750,1250],[2250,1250],
    [750,1750],[1250,1750],[1750,1750],[2250,1750]
  ];
  const p=pts[Math.floor(Math.random()*pts.length)];
  target={x:p[0],y:p[1]};
}

function startGame(){
  gameStarted=true;
  document.getElementById("start").classList.add("hidden");
  newTarget();
}

function nextMission(){
  document.getElementById("win").classList.add("hidden");
  mission++;
  score+=100;
  money+=250;
  player.hp=100;
  newTarget();
  updateHud();
}

function updateHud(){
  document.getElementById("hp").textContent=Math.max(0,Math.floor(player.hp));
  document.getElementById("score").textContent=score;
  document.getElementById("money").textContent=money;
  document.getElementById("mission").innerHTML=
    `<b>MISSION ${mission}</b><br>📍 Drive to the yellow marker`;
}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function update(){
  if(!gameStarted)return;

  const accel=keys.boost?.34:.22;
  const max=keys.boost?8:5;

  if(keys.up)player.speed+=accel;
  if(keys.down)player.speed-=.18;

  player.speed*=keys.brake?.90:.97;
  player.speed=Math.max(-2.5,Math.min(max,player.speed));

  if(Math.abs(player.speed)>.08){
    const turn=.045*(player.speed/max);
    if(keys.left)player.angle-=turn;
    if(keys.right)player.angle+=turn;
  }

  player.x+=Math.cos(player.angle)*player.speed;
  player.y+=Math.sin(player.angle)*player.speed;

  player.x=Math.max(30,Math.min(world.w-30,player.x));
  player.y=Math.max(30,Math.min(world.h-30,player.y));

  cars.forEach(car=>{
    car.x+=Math.cos(car.a)*car.v;
    car.y+=Math.sin(car.a)*car.v;

    if(car.x<20||car.x>world.w-20)car.a=Math.PI-car.a;
    if(car.y<20||car.y>world.h-20)car.a=-car.a;

    if(dist(player,car)<42){
      player.hp-=.15;
      player.speed*=.92;
    }
  });

  if(dist(player,target)<65){
    document.getElementById("win").classList.remove("hidden");
  }

  camera.x=player.x-W/2;
  camera.y=player.y-H/2;

  camera.x=Math.max(0,Math.min(world.w-W,camera.x));
  camera.y=Math.max(0,Math.min(world.h-H,camera.y));

  updateHud();
}

function rect(x,y,w,h){
  ctx.fillRect(
    x-camera.x,
    y-camera.y,
    w,h
  );
}

function circle(x,y,r){
  ctx.beginPath();
  ctx.arc(
    x-camera.x,
    y-camera.y,
    r,0,Math.PI*2
  );
  ctx.fill();
}

function drawWorld(){

ctx.fillStyle="#0b2418";
ctx.fillRect(0,0,W,H);

/* roads */

roads.forEach(r=>{
  ctx.fillStyle="#252b31";
  rect(r.x,r.y,r.w,r.h);

  ctx.strokeStyle="#ffffff18";
  ctx.lineWidth=2;

  if(r.w<r.h){
    for(let y=r.y;y<r.h;y+=45){
      ctx.beginPath();
      ctx.moveTo(r.x+45-camera.x,y-camera.y);
      ctx.lineTo(r.x+45-camera.x,y+25-camera.y);
      ctx.stroke();
    }
  }else{
    for(let x=r.x;x<r.w;x+=45){
      ctx.beginPath();
      ctx.moveTo(x-camera.x,r.y+45-camera.y);
      ctx.lineTo(x+25-camera.x,r.y+45-camera.y);
      ctx.stroke();
    }
  }
});

/* grass blocks */

ctx.fillStyle="#123522";
for(let x=0;x<world.w;x+=180){
  for(let y=0;y<world.h;y+=180){
    rect(x,y,170,170);
  }
}

/* buildings */

buildings.forEach(b=>{
  ctx.fillStyle=b.color;
  rect(b.x,b.y,b.w,b.h);

  ctx.fillStyle="#8fd8ff55";

  for(let wx=b.x+15;wx<b.x+b.w-10;wx+=28){
    for(let wy=b.y+15;wy<b.y+b.h-10;wy+=27){
      rect(wx,wy,10,9);
    }
  }
});

/* trees */

trees.forEach(t=>{
  ctx.fillStyle="#07150d";
  circle(t.x+3,t.y+5,16);

  ctx.fillStyle="#219653";
  circle(t.x,t.y,17);

  ctx.fillStyle="#2cb866";
  circle(t.x-8,t.y-7,9);
});

/* destination */

ctx.strokeStyle="#ffe044";
ctx.lineWidth=5;
ctx.beginPath();
ctx.arc(
  target.x-camera.x,
  target.y-camera.y,
  32+Math.sin(Date.now()/180)*5,
  0,Math.PI*2
);
ctx.stroke();

ctx.fillStyle="#ffe044";
circle(target.x,target.y,8);

/* cars */

cars.forEach(car=>drawCar(car.x,car.y,car.a,car.color));

/* player */

drawCar(
  player.x,
  player.y,
  player.angle,
  "#27e6ff",
  true
);

}

function drawCar(x,y,a,color,playerCar=false){

ctx.save();

ctx.translate(
  x-camera.x,
  y-camera.y
);

ctx.rotate(a);

ctx.fillStyle="#0008";
ctx.fillRect(-24,-14,48,28);

ctx.fillStyle=color;
ctx.fillRect(-22,-12,44,24);

ctx.fillStyle="#bdefff";
ctx.fillRect(-8,-9,18,18);

ctx.fillStyle="#111";
ctx.fillRect(-18,-15,10,5);
ctx.fillRect(8,-15,10,5);
ctx.fillRect(-18,10,10,5);
ctx.fillRect(8,10,10,5);

if(playerCar){
  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.strokeRect(-22,-12,44,24);
}

ctx.restore();

}

/* minimap */

function drawMiniMap(){

const s=120;
const x=W-s-12;
const y=H-s-85;

ctx.fillStyle="#061019dd";
ctx.fillRect(x,y,s,s);

ctx.strokeStyle="#ffffff25";
ctx.strokeRect(x,y,s,s);

cars.forEach(car=>{
  ctx.fillStyle="#ff5b5b";
  ctx.fillRect(
    x+(car.x/world.w)*s-2,
    y+(car.y/world.h)*s-2,
    4,4
  );
});

ctx.fillStyle="#ffe044";
ctx.fillRect(
  x+(target.x/world.w)*s-3,
  y+(target.y/world.h)*s-3,
  6,6
);

ctx.fillStyle="#28e5ff";
ctx.beginPath();
ctx.arc(
  x+(player.x/world.w)*s,
  y+(player.y/world.h)*s,
  4,0,Math.PI*2
);
ctx.fill();
}

function loop(){
  update();
  drawWorld();
  drawMiniMap();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
